<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metadata</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center">Automation Tool</h1>

      <div style="display: flex; justify-content: space-between">
        <h1>Metadata</h1>
        <button
          class="btn btn-primary btn-sm"
          onclick="downloadProcessedSheet()"
        >
          Download sheet
        </button>
      </div>
      <table class="table card shadow-sm mt-4">
        <thead>
          <tr>
            <th>Order No</th>
            <th>Status</th>
            <th>Success(T/F)</th>
            <th>Timestamp</th>
            <th>Link</th>
            <th>Message</th>
            <th>Error</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </body>
  <script>
    const folderId = window.location.pathname.split("/")[2];
    async function downloadProcessedSheet() {
      const folder = folderId; // replace with actual folder or dynamic value
      const url = `http://localhost:5555/download-processed-sheet/${folder}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("File not found or server error");

        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `processed_${folderId}.xlsx`; // rename as needed
        link.click();
        URL.revokeObjectURL(link.href);
      } catch (err) {
        alert("Error downloading file: " + err.message);
      }
    }

    fetch(`/get_metadata_api/${folderId}`)
      .then((response) => response.json())
      .then((data) => {
        const tbody = document.querySelector("tbody");
        tbody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.orderNo}</td>
            <td>${row.status}</td>
            <td>${row.success}</td>
            <td>${row.timestamp}</td>
            <td><a href="${row.url}" target="_blank">Link</a></td>
            <td>${row.message}</td>
            <td>${row.error || "N/A"}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch((error) => {
        console.error("Error fetching metadata:", error);
      });
  </script>
</html>
